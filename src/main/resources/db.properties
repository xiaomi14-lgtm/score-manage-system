# 数据库连接配置（DBUtil 使用）
# 注意：MySQL 8 默认使用 caching_sha2_password 认证，
# 必须带 allowPublicKeyRetrieval=true，否则会报
# "Public Key Retrieval is not allowed" 导致连接失败。
jdbc.driver=com.mysql.cj.jdbc.Driver
jdbc.url=jdbc:mysql://localhost:3306/scoreqa?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false
jdbc.username=root
jdbc.password=123456

# JWT 配置（可选用，本地示例仅演示）
app.jwt.secret=scoreqa-demo-jwt-secret-key-change-me-in-production-0123456789

# 上传目录
app.upload.dir=uploads/
